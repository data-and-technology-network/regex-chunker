[project]
name = "regex-chunker"
version = "0.1.0"
description = "A simple regex based chunker for splitting text into chunks"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "fastparquet>=2025.12.0",
    "ipykernel>=7.2.0",
    "markitdown[pdf]>=0.1.5",
    "pandas>=2.0.0",
    "tqdm>=4.67.3",
]


# Tell uv this is a package that should be installable 
#-> all modules from core can be imported as from core.module import blahblah
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Configure which packages to include
[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = []
